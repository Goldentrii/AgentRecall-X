name: CI

# Runs on every PR into main (incl. from forks) and on pushes to main.
# SECURITY: uses `pull_request` (NOT `pull_request_target`), so PRs from forks
# run with a READ-ONLY token and NO access to repository secrets. A fork PR can
# only propose changes and have them tested — it cannot read secrets, write to
# the repo, or affect main. Merging still requires your approval + branch protection.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read          # minimal token; no write scope

concurrency:              # cancel superseded runs on the same ref
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Measured local floor (build+lint+test+regression, warm cache): ~34s.
    # 10 min gives generous headroom for a cold npm cache + slower shared
    # runners without masking a genuine hang for an unreasonable time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Build all packages
        run: npm run build

      # Typecheck all 4 packages (tsc --noEmit). Requires the build step above:
      # mcp-server/sdk/cli resolve the `agent-recall-core` workspace package by
      # its built dist output, so this cannot run before `npm run build`.
      - name: Typecheck (lint)
        shell: bash
        run: npm run lint 2>&1 | tee lint-output.log

      - name: Regression suites
        run: |
          node benchmark/consistency.mjs
          node benchmark/funnel.mjs
          node benchmark/heeded-guard.mjs
          node benchmark/room-slug-guards.mjs

      # Full suite across all 4 packages, run last (slowest, most comprehensive
      # — everything cheaper already had to pass first).
      - name: Full test suite (all packages)
        shell: bash
        run: npm test 2>&1 | tee test-output.log

      # SECURITY: only upload the specific log files this job wrote (synthetic
      # local stdout/stderr captures) — never glob node_modules or unrelated
      # directories. Mirrors bench-fixture.yml's upload-artifact posture.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-logs-${{ github.sha }}
          path: |
            lint-output.log
            test-output.log
          if-no-files-found: warn
          retention-days: 30
