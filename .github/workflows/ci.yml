name: CI

# ── What runs where ──────────────────────────────────────────────────────────
# test-matrix is a 2-lane matrix: ubuntu-latest + windows-latest.
#   - ubuntu-latest  — THE gate for POSIX-only behavior: 4 tests self-skip on
#                      win32 with named reasons (3 mcp-server signal tests,
#                      1 symlink), and 1 mode-bit assertion is silently guarded
#                      in-test (blind-spots.test.mjs). Only here do they all run.
#   - windows-latest — exists because the owner develops on Windows; bench and
#                      test suites are portable since the fix/windows-paths
#                      work. Thanks to the self-skips/guards above, no step
#                      needs `if: runner.os`.
# Both lanes run the same steps: build → typecheck → 4 regression suites →
# full test suite. fail-fast is off so one lane's failure never cancels the
# other lane's verdict.
# The non-matrix `build-and-test` fan-in job below carries the status-check
# context that main's branch protection requires (exactly `build-and-test`,
# strict=true); the matrix lanes themselves report as `test (<os>)`.
# Expected state: the Windows lane goes green once fix/linux-core-tests lands
# (it fixes a recordOutcome read-modify-write race); until then the Windows
# lane fails on that one race test.
#
# Runs on every PR into main (incl. from forks) and on pushes to main.
# SECURITY: uses `pull_request` (NOT `pull_request_target`), so PRs from forks
# run with a READ-ONLY token and NO access to repository secrets. A fork PR can
# only propose changes and have them tested — it cannot read secrets, write to
# the repo, or affect main. Merging still requires your approval + branch protection.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read          # minimal token; no write scope

concurrency:              # cancel superseded runs on the same ref
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false    # keep the ubuntu gate's verdict even when Windows fails (and vice versa)
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Measured local floor (build+lint+test+regression, warm cache): ~34s on
    # Linux, ~3-4 min on a Windows dev box. 30 min covers the slower Windows
    # runner + a cold npm cache without masking a genuine hang forever.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash       # Git Bash on windows-latest; `tee` + pipes behave identically on both lanes
    env:
      # On Windows, npm runs package scripts through cmd.exe by default, which
      # does not expand the `test/*.test.mjs` glob in the per-package test
      # scripts — and the pinned Node 20 test runner has no built-in glob
      # support (added in Node 21). Forcing npm's script shell to bash
      # (present on both runner images) keeps script behavior identical
      # across lanes.
      npm_config_script_shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Build all packages
        run: npm run build

      # Typecheck all 4 packages (tsc --noEmit). Requires the build step above:
      # mcp-server/sdk/cli resolve the `agent-recall-core` workspace package by
      # its built dist output, so this cannot run before `npm run build`.
      - name: Typecheck (lint)
        run: npm run lint 2>&1 | tee lint-output.log

      - name: Regression suites
        run: |
          node benchmark/consistency.mjs
          node benchmark/funnel.mjs
          node benchmark/heeded-guard.mjs
          node benchmark/room-slug-guards.mjs

      # Full suite across all 4 packages, run last (slowest, most comprehensive
      # — everything cheaper already had to pass first).
      - name: Full test suite (all packages)
        run: npm test 2>&1 | tee test-output.log

      # SECURITY: only upload the specific log files this job wrote (synthetic
      # local stdout/stderr captures) — never glob node_modules or unrelated
      # directories. Mirrors bench-fixture.yml's upload-artifact posture.
      # The artifact name carries the OS: upload-artifact v4 rejects duplicate
      # artifact names, so the two matrix lanes must not collide.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-logs-${{ matrix.os }}-${{ github.sha }}
          path: |
            lint-output.log
            test-output.log
          if-no-files-found: warn
          retention-days: 30

  # ── Fan-in gate for branch protection ───────────────────────────────────────
  # main's branch protection requires the status-check context exactly
  # `build-and-test` (strict=true; verified read-only via
  # `gh api repos/Goldentrii/AgentRecall-X/branches/main/protection/required_status_checks`).
  # The matrix lanes report as `test (<os>)`, so without this job the required
  # context would never report and every PR would hang on "Expected". This
  # dependency-free job carries the required name and fails unless the whole
  # matrix succeeded. `if: always()` + the explicit result check matter: a
  # plain `needs:` gate is reported as SKIPPED when a lane fails or is
  # cancelled, and a skipped check SATISFIES a required context.
  # OWNER note: alternatively, update the required contexts to the per-lane
  # names at merge time and drop this job.
  build-and-test:
    name: build-and-test
    needs: [test-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on matrix result
        shell: bash
        run: |
          echo "test-matrix result: ${{ needs.test-matrix.result }}"
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "::error::test matrix did not succeed (result: ${{ needs.test-matrix.result }})"
            exit 1
          fi
          echo "All matrix lanes green."
