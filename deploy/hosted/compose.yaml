# Hosted AgentRecall: agent-recall-server behind Caddy (automatic HTTPS).
#
#   echo "AR_DOMAIN=recall.example.com" > .env
#   docker compose up -d --build
#
# Only Caddy is published (80/443). The server listens on the internal network
# only, so the bearer token never travels in plain HTTP outside the box.
#
# NEVER run `docker compose down -v`: -v deletes every user's memory (ar-data)
# and the TLS certificates (caddy-data).
name: agent-recall

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  server:
    build:
      context: ../..
      dockerfile: Dockerfile.server
    image: agent-recall-server:local
    restart: unless-stopped
    environment:
      AR_SERVER_QUOTA_MB: ${AR_SERVER_QUOTA_MB:-100}
      AR_SERVER_RATE_PER_MIN: ${AR_SERVER_RATE_PER_MIN:-120}
      # OAuth sign-in with GitHub / Google: on only when AR_PUBLIC_URL and at least one provider pair are set in .env (empty = off).
      AR_PUBLIC_URL: ${AR_PUBLIC_URL:-}
      AR_OAUTH_GITHUB_CLIENT_ID: ${AR_OAUTH_GITHUB_CLIENT_ID:-}
      AR_OAUTH_GITHUB_CLIENT_SECRET: ${AR_OAUTH_GITHUB_CLIENT_SECRET:-}
      AR_OAUTH_GOOGLE_CLIENT_ID: ${AR_OAUTH_GOOGLE_CLIENT_ID:-}
      AR_OAUTH_GOOGLE_CLIENT_SECRET: ${AR_OAUTH_GOOGLE_CLIENT_SECRET:-}
      AR_OAUTH_REDIRECT_ALLOW: ${AR_OAUTH_REDIRECT_ALLOW:-}
      AR_PRIVACY_URL: ${AR_PRIVACY_URL:-}  # optional https link to the privacy policy, shown on the sign-in page
      AR_OAUTH_SIGNUP: ${AR_OAUTH_SIGNUP:-}  # empty = invite-only (only accounts added with `identity link`); "open" = anyone
      AR_TRUST_PROXY: "1"  # Caddy is the one proxy hop in front
    volumes:
      - ar-data:/data
    expose:
      - "8787"
    # Least privilege: no Linux capabilities, no privilege escalation, read-only
    # image filesystem; the only writable places are the data volume and /tmp.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    logging: *logging

  caddy:
    # Pinned by digest (Caddy 2.11.9); bump deliberately.
    image: caddy:2.11.9@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    # The Caddyfile is a single-file bind mount: compose never notices an edit to it, and
    # a replaced file leaves the container on the old inode. setup.sh and domain-switch.sh
    # export the file's sha256; being part of the definition, a change recreates Caddy
    # (and nothing else does).
    labels:
      ar.caddyfile-sha: ${AR_CADDYFILE_SHA:-unset}
    depends_on:
      server:
        condition: service_healthy
    environment:
      AR_DOMAIN: ${AR_DOMAIN:?set AR_DOMAIN in deploy/hosted/.env}
      # Extra names that keep answering /mcp and redirect everything else (see Caddyfile; set by domain-switch.sh).
      AR_DOMAIN_ALIAS: ${AR_DOMAIN_ALIAS:-http://alias-unset.invalid}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  ar-data:
  caddy-data:
  caddy-config:
