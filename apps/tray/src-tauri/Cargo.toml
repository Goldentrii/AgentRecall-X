[package]
name = "agent-recall-tray"
version = "0.1.0"
description = "AgentRecall Windows tray app"
edition = "2021"
publish = false

[lib]
name = "agent_recall_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Testing hooks (offline simulation env var). NEVER enabled in the release build.
test-hooks = []
