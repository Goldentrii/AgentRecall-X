# Smithery legacy stdio config. https://smithery.ai/docs/config#smitheryyaml
# NOTE (checked 2026-11-14): the Smithery proxy, CLI and SDKs shut down on 2026-10-31 and
# smithery.ai is now a directory run by Arcade (see https://smithery.ai/future).
# Nothing publishes from this file any more. It is kept valid and truthful in case a
# directory still reads it. The schema page could not be fetched (404): UNVERIFIED.
#
# AgentRecall closes the Intelligent Distance between a person and their agents: a
# correction you give one agent reaches every connected agent.
# stdio transport, no required config. Supabase credentials are optional; without them
# the server runs in local-file-only mode. Hosted option: https://agentrecallx.com/mcp

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      supabaseUrl:
        type: string
        description: "Supabase project URL (optional, enables cloud sync)"
      supabaseKey:
        type: string
        description: "Supabase service role key (optional, enables cloud sync)"
      full:
        type: boolean
        default: false
        description: "Expose the extended tool surface (6 tools) instead of the default 5-tool surface"
    required: []
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: [
        "-y",
        "agent-recall-mcp@latest",
        ...(config.full ? ["--full"] : [])
      ],
      env: {
        ...(config.supabaseUrl ? { SUPABASE_URL: config.supabaseUrl } : {}),
        ...(config.supabaseKey ? { SUPABASE_KEY: config.supabaseKey } : {})
      }
    })
